# 生产部署：拉取 CI 构建好的镜像，不在服务器上编译。
#
#   mkdir -p data && cp .env.example .env    # 只需填管理密码
#   docker compose pull
#   docker compose up -d
#   # 然后浏览器打开 http://127.0.0.1:8080 导入账号、开跑检测
#
# 镜像由 GitHub Actions 发布（见 .github/workflows/docker.yml）。想从源码构建：
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 绝大多数设置都在管理界面里，不在这个文件里 —— 改完写回 /data/oasis_config.json，
# 重启不丢。这个文件只需要描述「怎么把容器跑起来」。

services:
  oasis:
    image: ghcr.io/chouhx/oasis:latest
    container_name: oasis
    restart: unless-stopped
    env_file: .env

    # 让容器能用 host.docker.internal 访问宿主机上的服务（iCloud HME 服务、
    # 本地取件代理）。容器里的 127.0.0.1 是容器自己，新部署最常见的「连接被拒」
    # 就是这个。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 只绑回环：检测台能启停任务、看到账号池、导出凭据，没有理由暴露在公网。
    # 远程访问走 SSH 隧道，或在前面挂一层带认证的反向代理。
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      # 账号池 + 运行时配置都在这里，重启和换镜像都不会丢。
      - ./data:/data

    # 检测只开 IMAP/Graph 连接（一条几 MB），不吃共享内存，也不再有浏览器。
    # 上限给 512MB 是留足余量的写法：实测常驻在 60MB 上下。
    mem_limit: 512m
    cpus: "2.0"

    # 一轮巡检可能正在读几十个邮箱。停止时让 worker 把手上这批读完；万一某个
    # 出口不通，mailbox 自己的超时（25s × 3）也会在此之前收尾，所以 120s 足够
    # 干净退出，不会退化成 SIGKILL。
    stop_grace_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
